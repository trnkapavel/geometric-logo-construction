A7468" stroke-width="0.9"/><circle cx="544" cy="886.44" r="3" fill="#7A7468"/><line x1="771.59" y1="297.58" x2="891" y2="295" stroke="#B50000" stroke-width="0.9"/><circle cx="771.59" cy="297.58" r="3.5" fill="#B50000"/><text class="l" x="905" y="300" text-anchor="start"><tspan x="905" dy="0">mísa P: kružnice R</tspan></text><line x1="418.78" y1="127.68" x2="314" y2="145" stroke="#B50000" stroke-width="0.9"/><circle cx="418.78" cy="127.68" r="3.5" fill="#B50000"/><text class="l" x="300" y="150" text-anchor="end"><tspan x="300" dy="0">ochranná zóna φR</tspan></text><line x1="494.75" y1="403.25" x2="314" y2="415" stroke="#B50000" stroke-width="0.9"/><circle cx="494.75" cy="403.25" r="3.5" fill="#B50000"/><text class="l" x="300" y="420" text-anchor="end"><tspan x="300" dy="0">otvor na kliku: r = R/2  (1 : 2)</tspan></text><line x1="868.8" y1="710.36" x2="891" y2="635" stroke="#B50000" stroke-width="0.9"/><circle cx="868.8" cy="710.36" r="3.5" fill="#B50000"/><text class="l" x="905" y="640" text-anchor="start"><tspan x="905" dy="0">zářez 45°, šířka m = R/4</tspan><tspan x="905" dy="20">(visačka se nasadí na kliku)</tspan></text><line x1="600" y1="665.56" x2="891" y2="755" stroke="#B50000" stroke-width="0.9"/><circle cx="600" cy="665.56" r="3.5" fill="#B50000"/><text class="l" x="905" y="760" text-anchor="start"><tspan x="905" dy="0">vnitřní roh P: tečna x = střed mísy</tspan></text><line x1="824" y1="867.16" x2="891" y2="875" stroke="#B50000" stroke-width="0.9"/><circle cx="824" cy="867.16" r="3.5" fill="#B50000"/><text class="l" x="905" y="880" text-anchor="start"><tspan x="905" dy="0">rámeček 2R × 2Rφ  (1 : φ)</tspan></text><line x1="392.4" y1="926.04" x2="314" y2="935" stroke="#B50000" stroke-width="0.9"/><circle cx="392.4" cy="926.04" r="3.5" fill="#B50000"/><text class="l" x="300" y="940" text-anchor="end"><tspan x="300" dy="0">rohy: kružnice m</tspan></text><line x1="376" y1="643.16" x2="314" y2="695" stroke="#B50000" stroke-width="0.9"/><circle cx="376" cy="643.16" r="3.5" fill="#B50000"/><text class="l" x="300" y="700" text-anchor="end"><tspan x="300" dy="0">dřík: šířka R = 4 m</tspan></text><text class="l" x="60" y="1110">modul m = R/4 · rámeček 8 m × 12,94 m · 6 kružnic, 7 přímek</text><text class="h" x="600" y="48" text-anchor="middle" font-size="20" fill="#202124">Previo Magazín · konstrukce značky</text><text class="l" x="1140" y="48" text-anchor="end">Previo · 2026</text><text class="l" x="60" y="1212" letter-spacing="2" font-size="13">KONCEPT</text><text class="h" x="60" y="1252" font-size="28" fill="#202124">P, které visí na klice</text><text class="l" x="60" y="1296" font-size="15">Visačka na kliku je v logu Previo odjakživa – je to červené i.</text><text class="l" x="60" y="1321" font-size="15">Magazín z ní dělá vlastní značku: písmeno P, jehož mísa je otvor</text><text class="l" x="60" y="1346" font-size="15">na kliku a zářez pod 45° ho nechá pověsit na dveře. Uvnitř se</text><text class="l" x="60" y="1371" font-size="15">navíc skrývá lupa – blog, který pro hoteliéry hledá a vysvětluje.</text><text class="l" x="60" y="1396" font-size="15">Jeden symbol pro všechny země, jazyk nese jen slovo vedle něj.</text><rect x="820" y="1190" width="330" height="280" fill="#FAF8F3" stroke="#D9D2C4"/><path transform="translate(822.55 1167.55) scale(0.63)" d="M144 102.78A28 28 0 0 1 172 74.78L256 74.78A112 112 0 0 1 344.47 255.46L304.24 215.22A56 56 0 1 0 284.44 235.02L324.68 275.25A112 112 0 0 1 256 298.78L256 409.22A28 28 0 0 1 228 437.22L172 437.22A28 28 0 0 1 144 409.22Z" fill="#B50000" fill-rule="evenodd"/></svg>